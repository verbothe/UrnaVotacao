function mkDemo(){let s=7;const r=n=>{s=(s*9301+49297)%233280;return Math.floor(s/233280*n)};const D={lideres:[],voluntarios:[]};
 const deps=[...new Set(VOL.flatMap(x=>x.deps))];
 for(let i=0;i<58;i++){const v=[];while(v.length<3){const x=String(1+(r(10)<7?r(7):r(21))).padStart(2,"0");if(!v.includes(x))v.push(x)}if(r(12)==0)v[2]="B";D.lideres.push({t:"2026-10-1"+(1+r(4))+" "+(8+r(12))+":"+String(r(60)).padStart(2,"0"),who:"Participante "+(i+1),dep:deps[r(deps.length)],v})}

function calc(){const S=subs(),T=TIPOS[tipo],cnt={};let B=0,N=0;

function donut(a,b,c){const t=a+b+c||1,R=42,C=2*Math.PI*R;let o=0;const seg=(v,col)=>{const l=v/t*C,e='<circle r="'+R+'" cx="55" cy="55" fill="none" stroke="'+col+'" stroke-width="16" stroke-dasharray="'+l+' '+(C-l)+'" stroke-dashoffset="'+(-o)+'" transform="rotate(-90 55 55)"/>';o+=l;return e};

function vApuracao(){const d=calc(),T=TIPOS[tipo],n=d.S.length,esp=+ESP[tipo]||0;
 const k=(c,v,l)=>'<div class="card kpi '+c+'"><b>'+v+'</b><span>'+l+'</span></div>';
 let h='<div class="grid k4">'+k("a",n,"Participantes (envios)")+k("g",d.valid,"Votos válidos")+k("n",d.B,"Votos em branco")+k("r",d.N,"Votos nulos")+(esp?k("a",pct(n,esp),"Participação ("+n+" de "+esp+")"):"")+'</div>';

 h+='<div class="grid two" style="margin-top:12px"><div class="card"><h2>🏆 Mais votados · 3 primeiros</h2>'+(top.length?'<div class="pod">'+top.map((x,i)=>'<div><b>'+(i+1)+'º</b>'+esc(x.nome)+'<br><small>'+x.votos+' votos · '+pct(x.votos,d.valid)+'</small></div>').join("")+'</div>':'<p class="mut">Ainda sem votos.</p>')+'</div>'

function vPart(){const d=calc(),S=d.S,n=S.length;let h='<div class="card"><h2>Participação esperada</h2><label>Total esperado de participantes: <input type="number" min="0" id="esp" value="'+esc(ESP[tipo])+'" style="width:100px" onchange="setEsp(this.value)"></label></div>';
 if(tipo==="voluntarios"){const v=LID.map(x=>({n:x[0],ok:S.some(s=>s.who===x[0])}));const ok=v.filter(x=>x.ok).length;
  h+='<div class="card" style="margin-top:12px"><h2>Líderes que já votaram: '+ok+' de '+v.length+' ('+pct(ok,v.length)+')</h2><div class="bw" style="height:14px;background:rgba(128,128,128,.2);border-radius:8px;overflow:hidden"><i style="display:block;height:100%;width:'+(ok/v.length*100)+'%;background:var(--ok)"></i></div><div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">'+v.map(x=>'<span class="tag '+(x.ok?'o':'w')+'">'+(x.ok?'✓ ':'⏳ ')+esc(x.n)+'</span>').join("")+'</div></div>'}
 else{const m={};S.forEach(s=>{m[s.dep||"(sem departamento)"]=(m[s.dep||"(sem departamento)"]||0)+1});const e=Object.entries(m).sort((a,b)=>b[1]-a[1]),mx=e[0]?e[0][1]:0;
  h+='<div class="card" style="margin-top:12px"><h2>Participantes por departamento</h2>'+(e.length?e.map(x=>'<div class="row"><div class="nm" style="flex-basis:34%">'+esc(x[0])+'</div><div class="bw"><i style="width:'+x[1]/mx*100+'%"></i></div><div class="v">'+x[1]+'</div></div>').join(""):'<p class="mut">Sem dados.</p>')+'</div>'}
 return h}
function setEsp(v){ESP[tipo]=v;salvar();render()}
function vReg(){const d=calc(),A=alertas(d.S),T=TIPOS[tipo];const nome=c=>c==="B"?"Branco":c==="N"?"Nulo":c?c+" "+((T.c[c]||{}).nome||"?"):"—";
 const q=norm(busca),rows=d.S.map((s,i)=>({s,i})).filter(x=>!q||norm(x.s.who+" "+x.s.dep+" "+x.s.v.map(nome).join(" ")).includes(q));
 return '<div class="card"><h2>Formulários preenchidos ('+d.S.length+')</h2><input type="search" id="bq" placeholder="🔍 Buscar nome, departamento ou voto" value="'+esc(busca)+'" oninput="busca=this.value;rr()" style="width:100%;margin-bottom:8px"><div class="tw" id="tb">'+tabela(rows,nome)+'</div></div>'}
function tabela(rows,nome){return '<table><tr><th>#</th><th>Data</th><th>Quem votou</th><th>1º</th><th>2º</th><th>3º</th><th>Conferência</th></tr>'+(rows.length?rows.map(x=>'<tr><td>'+(x.i+1)+'</td><td>'+esc(x.s.t||"")+'</td><td>'+esc(x.s.who)+(x.s.dep?'<br><small>'+esc(x.s.dep)+'</small>':'')+'</td>'+x.s.v.map(c=>'<td>'+esc(nome(c))+'</td>').join("")+'<td>'+((x.s._a||[]).map(f=>'<span class="tag e">'+f+'</span>').join("")||'<span class="tag o">ok</span>')+'</td></tr>').join(""):'<tr><td colspan="7" class="mut">Nenhum registro.</td></tr>')+'</table>'}
function rr(){const d=calc();alertas(d.S);const T=TIPOS[tipo];const nome=c=>c==="B"?"Branco":c==="N"?"Nulo":c?c+" "+((T.c[c]||{}).nome||"?"):"—";const q=norm(busca);$("tb").innerHTML=tabela(d.S.map((s,i)=>({s,i})).filter(x=>!q||norm(x.s.who+" "+x.s.dep+" "+x.s.v.map(nome).join(" ")).includes(q)),nome)}
function vAl(){const A=alertas(calc().S);return '<div class="card"><h2>Conferência: possíveis irregularidades ('+A.length+')</h2><p class="mut" style="margin-top:0">Nome repetido, mesmo '+TIPOS[tipo].cand+' em dois votos, votos incompletos'+(tipo==="voluntarios"?" e líder votando em si mesmo":"")+'. É um aviso para você conferir, não uma anulação automática.</p>'+(A.length?'<div class="tw"><table><tr><th>#</th><th>Quem</th><th>Avisos</th></tr>'+A.map(a=>'<tr><td>'+(a.i+1)+'</td><td>'+esc(a.s.who)+'</td><td>'+a.f.map(f=>'<span class="tag e">'+f+'</span>').join("")+'</td></tr>').join("")+'</table></div>':'<p><span class="tag o">Nada a conferir</span></p>')+'</div>'}
function vDados(){const n=k=>DATA[k].length;return '<div class="grid two"><div class="card"><h2>Importar dados do Jotform</h2><p class="mut" style="margin-top:0">No Jotform, abra o formulário → <b>Caixa de Envios → Baixar → Excel ou CSV</b>. Depois escolha o arquivo aqui. Os dados ficam só neste navegador e não são enviados a ninguém. O painel reconhece sozinho de qual votação é o arquivo.</p><label class="drop" for="arq">📥 Escolher arquivo (.xlsx ou .csv)<input id="arq" type="file" accept=".xlsx,.xls,.csv" hidden onchange="imp(this.files[0])"></label><p id="msg"></p></div><div class="card"><h2>Dados carregados</h2><p>Liderados → Líderes: <b>'+n("lideres")+'</b> envios<br>Líderes → Voluntários: <b>'+n("voluntarios")+'</b> envios</p><button class="btn s" onclick="limpar()">Apagar dados deste navegador</button> <button class="btn" onclick="demo=!demo;render()">'+(demo?'Sair da demonstração':'Ver demonstração')+'</button></div></div>'}
function limpar(){if(confirm("Apagar os dados carregados neste navegador?")){DATA={lideres:[],voluntarios:[]};salvar();render()}}
function code(v){v=String(v==null?"":v).trim();if(!v)return null;if(/branco/i.test(norm(v)))return"B";if(/nulo/i.test(norm(v)))return"N";const m=v.match(/^(\d{1,3})/);return m?m[1].padStart(2,"0"):null}
function imp(f){if(!f)return;const r=new FileReader(),ext=/\.csv$/i.test(f.name);
 r.onload=()=>{try{const wb=XLSX.read(r.result,{type:ext?"string":"array",cellDates:true});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""});
  const H=rows[0].map(norm),ix=re=>H.findIndex(h=>re.test(h));
  const vol=ix(/quem e voce|lider/)>=0&&ix(/^1\D{0,2}voto/)>=0,tp=vol?"voluntarios":"lideres";
  const w=vol?ix(/quem e voce/):ix(/nome completo/),dp=ix(/departamento/),t=ix(/data|date/),v=[1,2,3].map(k=>ix(new RegExp("^"+k+"\\D{0,2}voto")));
  if(w<0||v.some(x=>x<0))throw new Error("Colunas não reconhecidas");
  DATA[tp]=rows.slice(1).filter(x=>x.some(c=>String(c).trim())).map(x=>({t:t>=0?String(x[t]):"",who:String(x[w]).trim(),dep:dp>=0?String(x[dp]).trim():"",v:v.map(k=>code(x[k]))}));
  salvar();demo=false;tipo=tp;aba="apuracao";render()}catch(e){$("msg").innerHTML='<span class="tag e">Não consegui ler este arquivo ('+esc(e.message)+'). Baixe de novo do Jotform.</span>'}};
 ext?r.readAsText(f,"UTF-8"):r.readAsArrayBuffer(f)}
const ABAS=[["apuracao","Apuração"],["part","Participação"],["reg","Registros"],["al","Conferência"],["dados","Dados"]];
function render(){
 $("live").textContent=liveTxt();
 $("seg").innerHTML=Object.entries(TIPOS).map(([k,v])=>'<button class="'+(k===tipo?'on':'')+'" onclick="tipo=\''+k+'\';render();buscar(tipo)">'+v.nome+'</button>').join("");
 $("tabs").innerHTML=ABAS.map(a=>'<button class="'+(a[0]===aba?'on':'')+'" onclick="aba=\''+a[0]+'\';render()">'+a[1]+'</button>').join("");
 $("dem").innerHTML=demo?'<div class="dem">MODO DEMONSTRAÇÃO · dados fictícios, só para ver o painel. Em Dados, saia da demonstração.</div>':"";
 $("view").innerHTML={apuracao:vApuracao,part:vPart,reg:vReg,al:vAl,dados:()=>vLive()+'<div style="height:12px"></div>'+vDados()}[aba]()}
let CFG={key:"",eu:false,seg:60,ids:{lideres:"262868986267077",voluntarios:"262875651898074,262963651580060"}};
try{const c=JSON.parse(localStorage.getItem("painel_cfg")||"null");if(c)CFG=Object.assign(CFG,c,{ids:Object.assign(CFG.ids,c.ids||{})})}catch(e){}
let ult="",err="",pausa=false,tm=null,busy=false;
const salvarC=()=>{try{localStorage.setItem("painel_cfg",JSON.stringify(CFG))}catch(e){}};
function liveTxt(){return !CFG.key?"○ Sem conexão com o Jotform (configure na aba Dados)":err?"⚠ "+err:pausa?"⏸ Atualização pausada":"● Ao vivo · atualizado às "+(ult||"…")}
function conv(s,tp){
 const A=Object.values(s.answers||{}),get=re=>{const a=A.find(x=>re.test(norm(x.text||"")));return a&&a.answer!=null?(Array.isArray(a.answer)?a.answer.join(", "):String(a.answer)).trim():""};
 let who=tp==="voluntarios"?get(/quem e voce/):get(/nome completo/);
 if(tp==="voluntarios"&&/^outro/i.test(norm(who))){const o=get(/nome.*lista/);who=o?"Outro: "+o:who}
 const v=[1,2,3].map(k=>code(get(new RegExp("^"+k+"\\D{0,2}voto"))));
 if(!who&&!v.some(x=>x))return null;
 return {t:s.created_at||"",who,dep:get(/departamento/),v}}
async function buscar(tp){
 if(!CFG.key||busy)return;busy=true;err="";
 try{
  let all=[];
  for(const id of String(CFG.ids[tp]).split(/[\s,;]+/).filter(Boolean)){
   const base=(CFG.eu?"https://eu-api.jotform.com":"https://api.jotform.com")+"/form/"+id+"/submissions";let off=0;
   for(;;){
    const r=await fetch(base+"?apiKey="+encodeURIComponent(CFG.key)+"&limit=1000&offset="+off);
    const j=await r.json();
    if(j.responseCode!==200)throw new Error(j.message||("erro "+j.responseCode));
    all=all.concat(j.content);if(j.content.length<1000)break;off+=1000}}
  DATA[tp]=all.filter(x=>x.status!=="DELETED").map(x=>conv(x,tp)).filter(Boolean).sort((a,b)=>a.t<b.t?-1:1);
  salvar();ult=new Date().toLocaleTimeString("pt-BR")
 }catch(e){err="Não consegui atualizar ("+(e.message||"falha de conexão")+"). Confira a chave, a região e o ID do formulário."}
 busy=false;
 const ed=document.activeElement&&/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
 if(ed)$("live").textContent=liveTxt();else render()}
function agendar(){clearInterval(tm);tm=setInterval(()=>{if(!pausa&&!document.hidden)buscar(tipo)},CFG.seg*1000)}
function vLive(){return '<div class="card"><h2>🔴 Atualização em tempo real (Jotform)</h2><p class="mut" style="margin-top:0">Cole uma chave de API <b>somente de leitura</b> (Jotform → Configurações → API → criar chave com permissão de leitura). A chave fica só neste navegador e não é enviada a ninguém além do Jotform. Não use em computador compartilhado.</p><div class="grid two"><label>Chave de API<br><input type="password" id="ck" value="'+esc(CFG.key)+'" style="width:100%" autocomplete="off"></label><label>Região da conta<br><select id="cr" style="width:100%"><option value="0"'+(CFG.eu?'':' selected')+'>Padrão (api.jotform.com)</option><option value="1"'+(CFG.eu?' selected':'')+'>Europa (eu-api.jotform.com)</option></select></label><label>Formulário dos liderados (ID)<br><input type="search" id="c1" value="'+esc(CFG.ids.lideres)+'" style="width:100%"></label><label>Formulário(s) dos voluntários (ID; mais de um separado por vírgula)<br><input type="search" id="c2" value="'+esc(CFG.ids.voluntarios)+'" style="width:100%"></label><label>Atualizar a cada<br><select id="cs" style="width:100%">'+[30,60,120].map(x=>'<option value="'+x+'"'+(CFG.seg===x?' selected':'')+'>'+x+' segundos</option>').join("")+'</select></label></div><div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn" onclick="salvarCfg()">Salvar e conectar</button><button class="btn s" onclick="buscar(tipo)">Atualizar agora</button><button class="btn s" onclick="pausa=!pausa;render()">'+(pausa?'Retomar':'Pausar')+'</button><button class="btn s" onclick="desconectar()">Desconectar</button></div></div>'}
function salvarCfg(){CFG.key=$("ck").value.trim();CFG.eu=$("cr").value==="1";CFG.ids={lideres:$("c1").value.trim(),voluntarios:$("c2").value.trim()};CFG.seg=+$("cs").value;salvarC();err="";pausa=false;agendar();buscar(tipo)}
function desconectar(){CFG.key="";salvarC();clearInterval(tm);err="";render()}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&CFG.key)buscar(tipo)});
render();
if(CFG.key){buscar(tipo);agendar()}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</body></html>
